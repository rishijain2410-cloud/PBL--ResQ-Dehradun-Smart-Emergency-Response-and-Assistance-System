<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEEVAN MARG &mdash; Secure Login</title>
    <!-- Protocol File Guard & Cloud Mock Resilience -->
    <script src="js/file-guard.js"></script>
    <script src="js/cloud-mock.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4">

    <div class="max-w-md w-full bg-slate-800/90 backdrop-blur-md border border-slate-700/80 rounded-2xl p-8 shadow-2xl shadow-black/50">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white shadow-lg shadow-emerald-500/30">
                <i class="fa-solid fa-truck-medical text-3xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight text-white">JEEVAN MARG</h1>
            <p class="text-xs text-slate-400 mt-1 uppercase tracking-wider font-semibold">Sign in to your role portal</p>
        </div>

        <!-- Error Message Alert -->
        <div id="error-alert" class="hidden mb-6 p-3 rounded-xl bg-red-950/80 border border-red-500/50 text-red-200 text-xs flex items-center space-x-2">
            <i class="fa-solid fa-circle-exclamation text-red-400"></i>
            <span id="error-msg">Invalid credentials</span>
        </div>

        <!-- Form -->
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" for="username">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-user text-sm"></i>
                    </span>
                    <input id="username" type="text" required placeholder="Enter username" class="w-full pl-10 pr-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" for="password">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input id="password" type="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
                </div>
            </div>

            <button id="submit-btn" type="submit" class="w-full mt-2 py-3 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-emerald-600/30 hover:shadow-emerald-500/40 transition duration-150 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
                <span id="btn-text">Sign In</span>
            </button>
        </form>

        <!-- Patient Registration Prompt -->
        <div class="mt-6 pt-6 border-t border-slate-700/60 text-center">
            <p class="text-xs text-slate-400">Need emergency assistance as a patient?
                <a href="/register.html" class="text-emerald-400 hover:text-emerald-300 font-semibold underline ml-1">Register as Patient</a>
            </p>
            <div class="mt-4 pt-3 flex items-center justify-center space-x-3 text-[11px] text-slate-500">
                <a href="/index.html" class="hover:text-slate-300 transition"><i class="fa-solid fa-house mr-1"></i> Control Room / Map</a>
                <span>&bull;</span>
                <span>System Role-Based Access</span>
            </div>
        </div>

        <!-- Default Credentials Hint -->
        <div class="mt-6 p-3 rounded-xl bg-slate-900/60 border border-slate-800 text-[11px] text-slate-400">
            <p class="font-semibold text-slate-300 mb-1"><i class="fa-solid fa-key mr-1 text-amber-400"></i> Seed Administrator Account:</p>
            <p>Username: <code class="text-emerald-300 bg-slate-800 px-1 py-0.5 rounded">admin</code> | Password: <code class="text-emerald-300 bg-slate-800 px-1 py-0.5 rounded">admin123</code></p>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // If already logged in, redirect to respective role dashboard
        if (Auth.isLoggedIn()) {
            const user = Auth.getUser();
            if (user && user.role) {
                Auth.redirectForRole(user.role);
            }
        }

        const form = document.getElementById('login-form');
        const errorAlert = document.getElementById('error-alert');
        const errorMsg = document.getElementById('error-msg');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorAlert.classList.add('hidden');
            btnText.textContent = 'Authenticating...';
            submitBtn.disabled = true;

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await Auth.login(username, password);
                btnText.textContent = 'Redirecting...';
                const user = (res && res.user) || (Auth.getUser && Auth.getUser()) || { role: 'ADMIN' };
                Auth.redirectForRole(user.role || 'ADMIN');
            } catch (err) {
                errorMsg.textContent = err.message || 'Login failed. Please check your credentials.';
                errorAlert.classList.remove('hidden');
                btnText.textContent = 'Sign In';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
