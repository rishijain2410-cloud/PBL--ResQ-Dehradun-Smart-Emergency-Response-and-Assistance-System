<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEEVAN MARG &mdash; Patient Registration</title>
    <!-- Protocol File Guard & Cloud Mock Resilience -->
    <script src="js/file-guard.js"></script>
    <script src="js/cloud-mock.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4">

    <div class="max-w-md w-full bg-slate-800/90 backdrop-blur-md border border-slate-700/80 rounded-2xl p-8 shadow-2xl shadow-black/50">
        <!-- Logo & Header -->
        <div class="text-center mb-6">
            <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-purple-500/30">
                <i class="fa-solid fa-hospital-user text-2xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight text-white">Patient Registration</h1>
            <p class="text-xs text-slate-400 mt-1">Register for instant emergency healthcare &amp; ambulance tracking</p>
        </div>

        <!-- Alert messages -->
        <div id="error-alert" class="hidden mb-4 p-3 rounded-xl bg-red-950/80 border border-red-500/50 text-red-200 text-xs flex items-center space-x-2">
            <i class="fa-solid fa-circle-exclamation text-red-400"></i>
            <span id="error-msg">Registration error</span>
        </div>
        <div id="success-alert" class="hidden mb-4 p-3 rounded-xl bg-emerald-950/80 border border-emerald-500/50 text-emerald-200 text-xs flex items-center space-x-2">
            <i class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="success-msg">Account created! Redirecting to login...</span>
        </div>

        <!-- Registration Form -->
        <form id="reg-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1" for="displayName">Full Name</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-id-card text-sm"></i>
                    </span>
                    <input id="displayName" type="text" required placeholder="e.g. Ramesh Verma" class="w-full pl-10 pr-4 py-2 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1" for="phone">Phone Number</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-phone text-sm"></i>
                    </span>
                    <input id="phone" type="tel" required placeholder="e.g. 9876543210" class="w-full pl-10 pr-4 py-2 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1" for="username">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-user text-sm"></i>
                    </span>
                    <input id="username" type="text" required placeholder="Choose a username" class="w-full pl-10 pr-4 py-2 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1" for="password">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input id="password" type="password" required minlength="6" placeholder="At least 6 characters" class="w-full pl-10 pr-4 py-2 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition">
                </div>
            </div>

            <button id="submit-btn" type="submit" class="w-full mt-2 py-3 px-4 bg-purple-600 hover:bg-purple-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-purple-600/30 hover:shadow-purple-500/40 transition duration-150 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-user-plus"></i>
                <span id="btn-text">Create Patient Account</span>
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-700/60 text-center">
            <p class="text-xs text-slate-400">Already have an account?
                <a href="/login.html" class="text-purple-400 hover:text-purple-300 font-semibold underline ml-1">Sign In</a>
            </p>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const form = document.getElementById('reg-form');
        const errorAlert = document.getElementById('error-alert');
        const errorMsg = document.getElementById('error-msg');
        const successAlert = document.getElementById('success-alert');
        const successMsg = document.getElementById('success-msg');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorAlert.classList.add('hidden');
            successAlert.classList.add('hidden');

            const displayName = document.getElementById('displayName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            btnText.textContent = 'Registering...';
            submitBtn.disabled = true;

            try {
                await Auth.register(username, password, displayName, phone);
                // Attempt automatic login
                const loginRes = await Auth.login(username, password);
                successMsg.textContent = 'Registration successful! Taking you to Patient portal...';
                successAlert.classList.remove('hidden');
                setTimeout(() => {
                    Auth.redirectForRole(loginRes.user.role);
                }, 1000);
            } catch (err) {
                errorMsg.textContent = err.message || 'Registration failed.';
                errorAlert.classList.remove('hidden');
                btnText.textContent = 'Create Patient Account';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
